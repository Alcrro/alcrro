name: Update README from resume.json

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly fallback, Monday 06:00 UTC
  workflow_dispatch: {}    # manual trigger button in the Actions tab
  repository_dispatch:
    types: [resume-updated]   # triggered by alexandruroventa repo on push to resume.json

jobs:
  build-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout alcrro repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch resume.json from alexandruroventa repo
        run: |
          curl -f -o resume.json \
            https://raw.githubusercontent.com/Alcrro/alexandruroventa/main/resume.json

      - name: Generate README
        run: node scripts/generate-readme.js

      - name: Commit README only (resume.json is not part of this repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update README from resume.json"
          git push
          rm -f resume.json
